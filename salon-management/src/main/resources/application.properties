spring.application.name=salon-management

# .env file (project root) automatically load hoti hai. Agar file nahi hai to bhi app chalega.
spring.config.import=optional:file:.env[.properties]

# ---------------- DATABASE ----------------
# DB_URL set nahi hai to local H2 (in-memory) use hoga, taaki app bina Supabase ke bhi chal sake.
# Supabase ke liye .env mein DB_URL, DB_USERNAME, DB_PASSWORD daalo.
spring.datasource.url=${DB_URL:jdbc:h2:mem:salondb;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jackson.serialization.write-dates-as-timestamps=false

server.port=${PORT:8080}

# ---------------- ADMIN LOGIN ----------------
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.password=${ADMIN_PASSWORD:admin123}

# ---------------- WHATSAPP CLOUD API ----------------
whatsapp.token=${WHATSAPP_TOKEN:}
whatsapp.phone-number-id=${WHATSAPP_PHONE_NUMBER_ID:}
whatsapp.verify-token=${WHATSAPP_VERIFY_TOKEN:salon-verify-token}
whatsapp.api-version=${WHATSAPP_API_VERSION:v21.0}
whatsapp.default-country-code=${WHATSAPP_DEFAULT_COUNTRY_CODE:91}
# Optional: approved template ka naam (24 ghante ke bahar message bhejne ke liye zaroori)
whatsapp.confirm-template=${WHATSAPP_CONFIRM_TEMPLATE:}
whatsapp.template-language=${WHATSAPP_TEMPLATE_LANGUAGE:en}
